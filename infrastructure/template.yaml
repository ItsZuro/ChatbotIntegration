AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Infraestructura base de UTP Assistant.
  FastAPI será desplegado posteriormente sobre ECS Fargate.

Resources:

  # =========================================================
  # DYNAMODB - AUDITORÍA
  # =========================================================

  UtpAssistantAuditTable:
    Type: AWS::DynamoDB::Table

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: utp-assistant-audit
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S

      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

      SSESpecification:
        SSEEnabled: true


  # =========================================================
  # DYNAMODB - CONVERSACIONES
  # =========================================================

  UtpAssistantConversationsTable:
    Type: AWS::DynamoDB::Table

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: utp-assistant-conversations
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S

        - AttributeName: sk
          AttributeType: S

        - AttributeName: gsi1pk
          AttributeType: S

        - AttributeName: gsi1sk
          AttributeType: S

      KeySchema:
        - AttributeName: pk
          KeyType: HASH

        - AttributeName: sk
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: UserConversationsIndex

          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH

            - AttributeName: gsi1sk
              KeyType: RANGE

          Projection:
            ProjectionType: ALL

      SSESpecification:
        SSEEnabled: true


  # =========================================================
  # DYNAMODB - CUOTAS DE USO
  # =========================================================

  UtpAssistantUsageTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: utp-assistant-usage
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S

        - AttributeName: sk
          AttributeType: S

      KeySchema:
        - AttributeName: pk
          KeyType: HASH

        - AttributeName: sk
          KeyType: RANGE

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      SSESpecification:
        SSEEnabled: true


  # =========================================================
  # DYNAMODB - INTEGRACIONES POR USUARIO
  # =========================================================

  UtpAssistantIntegrationsTable:
    Type: AWS::DynamoDB::Table

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: utp-assistant-integrations
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S

        - AttributeName: sk
          AttributeType: S

      KeySchema:
        - AttributeName: pk
          KeyType: HASH

        - AttributeName: sk
          KeyType: RANGE

      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

      SSESpecification:
        SSEEnabled: true


  # =========================================================
  # S3 - DOCUMENTOS
  # =========================================================

  UtpAssistantDocumentsBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'

            AllowedMethods:
              - GET
              - PUT

            AllowedOrigins:
              - http://localhost:5173
              - http://127.0.0.1:5173
              - https://utp-assistant-psi.vercel.app

            ExposedHeaders:
              - ETag

            MaxAge: 3600


  # =========================================================
  # COGNITO - USUARIOS
  # =========================================================

  UtpAssistantUserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: utp-assistant-users

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      UsernameConfiguration:
        CaseSensitive: false

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false


  UtpAssistantUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      ClientName: utp-assistant-web

      UserPoolId:
        Ref: UtpAssistantUserPool

      GenerateSecret: false

      PreventUserExistenceErrors: ENABLED

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days


  # =========================================================
  # IAM - ACCESO A INTEGRACIONES POR USUARIO
  # =========================================================

  UtpAssistantIntegrationsDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy

    Properties:
      ManagedPolicyName: UtpAssistantIntegrationsDynamoDBManaged

      Roles:
        - utp-assistant-ecs-task-role

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Sid: UserIntegrationsDynamoDB
            Effect: Allow

            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:DeleteItem
              - dynamodb:UpdateItem

            Resource:
              Fn::GetAtt:
                - UtpAssistantIntegrationsTable
                - Arn


Outputs:

  AuditTableName:
    Description: Tabla DynamoDB de auditoría
    Value:
      Ref: UtpAssistantAuditTable


  ConversationsTableName:
    Description: Tabla DynamoDB de conversaciones
    Value:
      Ref: UtpAssistantConversationsTable


  DocumentsBucketName:
    Description: Bucket privado de documentos
    Value:
      Ref: UtpAssistantDocumentsBucket


  CognitoUserPoolId:
    Description: Cognito User Pool de UTP Assistant
    Value:
      Ref: UtpAssistantUserPool


  CognitoUserPoolClientId:
    Description: Cognito App Client del frontend
    Value:
      Ref: UtpAssistantUserPoolClient


  UsageTableName:
    Description: Tabla DynamoDB de cuotas de uso
    Value:
      Ref: UtpAssistantUsageTable


  IntegrationsTableName:
    Description: Tabla DynamoDB de integraciones por usuario
    Value:
      Ref: UtpAssistantIntegrationsTable