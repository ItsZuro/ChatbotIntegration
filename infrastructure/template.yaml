AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Infraestructura serverless inicial de UTP Assistant.

Globals:
  Function:
    Runtime: python3.14
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  UtpAssistantHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'

  UtpAssistantAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: utp-assistant-audit
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S

      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

      SSESpecification:
        SSEEnabled: true

  UtpAssistantOrchestrator:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: utp-assistant-orchestrator
      CodeUri: ../backend/orchestrator/
      Handler: app.lambda_handler

      Environment:
        Variables:
          OPENAI_SECRET_ID: utp-assistant/openai
          HUBSPOT_FUNCTION_NAME: !Ref UtpAssistantHubSpotFunction
          JIRA_FUNCTION_NAME: !Ref UtpAssistantJiraFunction
          GOOGLE_FUNCTION_NAME: !Ref UtpAssistantGoogleFunction
          AUDIT_TABLE_NAME: !Ref UtpAssistantAuditTable
          DOCUMENTS_FUNCTION_NAME: !Ref UtpAssistantDocumentsFunction

      Policies:
        - Statement:
            - Sid: ReadOpenAISecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:utp-assistant/openai-*"
              
        - Statement:
            - Sid: InvokeHubSpotFunction
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt UtpAssistantHubSpotFunction.Arn

        - Statement:
            - Sid: InvokeJiraFunction
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt UtpAssistantJiraFunction.Arn
              
        - Statement:
            - Sid: InvokeGoogleFunction
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt UtpAssistantGoogleFunction.Arn

        - Statement:
            - Sid: WriteAuditRecords
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt UtpAssistantAuditTable.Arn

        - Statement:
            - Sid: InvokeDocumentsFunction
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt UtpAssistantDocumentsFunction.Arn

      Events:
        AssistantMessage:
          Type: HttpApi
          Properties:
            ApiId: !Ref UtpAssistantHttpApi
            Path: /assistant/message
            Method: POST

  UtpAssistantJiraFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: utp-assistant-jira
      CodeUri: ../backend/functions/jira/
      Handler: app.lambda_handler

      Environment:
        Variables:
          JIRA_SECRET_ID: utp-assistant/jira

      Policies:
        - Statement:
            - Sid: ReadJiraSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:utp-assistant/jira-*"

  UtpAssistantGoogleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: utp-assistant-google
      CodeUri: ../backend/functions/google/
      Handler: app.lambda_handler

      Environment:
        Variables:
          GOOGLE_SECRET_ID: utp-assistant/google
          GOOGLE_TIME_ZONE: America/Lima

      Policies:
        - Statement:
            - Sid: ReadGoogleSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:utp-assistant/google-*"

  UtpAssistantHubSpotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: utp-assistant-hubspot
      CodeUri: ../backend/functions/hubspot/
      Handler: app.lambda_handler

      Environment:
        Variables:
          HUBSPOT_SECRET_ID: utp-assistant/hubspot

      Policies:
        - Statement:
            - Sid: ReadHubSpotSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:utp-assistant/hubspot-*"

  UtpAssistantDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

  UtpAssistantDocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: utp-assistant-documents
      CodeUri: ../backend/functions/documents/
      Handler: app.lambda_handler

      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref UtpAssistantDocumentsBucket

      Policies:
        - Statement:
            - Sid: ReadWriteDocuments
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${UtpAssistantDocumentsBucket.Arn}/*"

Outputs:

  ApiUrl:
    Description: URL del endpoint principal de UTP Assistant
    Value: !Sub "https://${UtpAssistantHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/assistant/message"

  OrchestratorFunctionArn:
    Description: ARN de la Lambda Orchestrator
    Value: !GetAtt UtpAssistantOrchestrator.Arn
